[project]
name = "starfish-foundry-adapter"
version = "0.1.0"
description = "Starfish governance adapter for Azure AI Foundry Agent Service custom function calling"
requires-python = ">=3.9"
dependencies = []  # deliberately zero third-party deps -- stdlib urllib only, matching the sidecar's own
                    # "no runtime dependencies" posture (README.md's description of the CLI bundle)
readme = "README.md"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
