# OpenSSF Scorecard — measures repo security posture and publishes results.
# Docs: https://github.com/ossf/scorecard-action
name: Scorecard supply-chain security

on:
  # Re-run whenever branch protection changes so the Branch-Protection check stays fresh.
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 6'   # Weekly, Saturday 01:30 UTC
  push:
    branches: [ "master" ]

# Least-privilege at the top level; the job below elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # Upload SARIF results to the Security tab
      id-token: write          # Publish results to the OpenSSF (enables the badge)

    steps:
      - name: "Checkout code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF API so the score is public and a badge is available.
          # Requires the id-token: write permission above.
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Surfaces findings in the repo's Security > Code scanning tab.
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
