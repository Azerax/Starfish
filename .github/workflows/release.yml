name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write   # required for npm provenance (OIDC)
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # ssf.md 3.2 — SHA-pinned; see the note in ci.yml. Same commits the v4 tags pointed at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Full verify gate
        run: npm run ci
      - name: CLI bundle
        run: npm run build:cli
      - name: Generate SBOM
        run: npm run sbom > sbom.txt || true
      - name: Publish project-starfish (CLI) with provenance
        run: npm publish --provenance --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.txt
