name: CI
on:
  push:
  pull_request:

# ssf.md 3.1 — least privilege. This job checks out code and runs npm scripts: it writes nothing back
# to the repo, posts no comments and uploads no artifacts, so read is sufficient. Without a top-level
# block the GITHUB_TOKEN inherits broad default scopes; release.yml and scorecard.yml already declared
# theirs, and ci.yml was the only one flagged.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # ssf.md 3.2 — actions pinned by commit SHA, not by mutable tag. A tag can be repointed by the
      # upstream owner; a SHA cannot. Each pin is the commit the v4 tag pointed at when applied, so
      # behaviour is identical — deliberately NOT bumped to a new major in the same change. Dependabot
      # (3.3) proposes future bumps, each of which still has to pass this suite under branch protection.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Secret scan (supply chain)
        run: npm run scan:secrets
      - name: Typecheck (type layer)
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Conformance suite
        run: npm run test:conformance
      - name: Determinism suite
        run: npm run test:determinism
      - name: Dependency-direction lint
        run: npm run lint:deps
      - name: IP denylist scan (compliance)
        run: npm run scan:ip
      - name: SBOM + license check (compliance)
        run: npm run sbom
      - name: CLI bundle
        run: npm run build:cli
